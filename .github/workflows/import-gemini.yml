name: Import Gemini snapshot

on:
  push:
    branches:
      - ops/import-gemini

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: target

      - name: Checkout Gemini snapshot
        uses: actions/checkout@v4
        with:
          repository: reapirez-cloud/Meganot-gemini
          ref: c0ad0e309e051378336f58217cae8ae79cf71057
          path: source

      - name: Replace project with Gemini snapshot
        shell: bash
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            source/MEGANOTRPG-main/ target/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Install dependencies
        working-directory: target
        run: npm ci

      - name: Lint
        working-directory: target
        run: npm run lint

      - name: Build production bundle
        working-directory: target
        run: npm run build

      - name: Run tests and record known stale expectations
        working-directory: target
        continue-on-error: true
        run: npm test

      - name: Commit Gemini snapshot to main
        working-directory: target
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project differences to import."
            exit 0
          fi
          git commit -m "import: replace project with Gemini snapshot c0ad0e3"
          git push origin HEAD:main
