# one-shot importer
name: Import Gemini updates

on:
  push:
    branches:
      - ops/import-gemini

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: target

      - name: Checkout Gemini history
        uses: actions/checkout@v4
        with:
          repository: reapirez-cloud/Meganot-gemini
          ref: 035fbbf9dbeeaa9a2a91d9a68757dd9fc789cadb
          fetch-depth: 0
          path: source

      - name: Import validation and error handling
        shell: bash
        run: |
          git -C source diff \
            c0ad0e309e051378336f58217cae8ae79cf71057 \
            a75084b424e2dcc76f339b517d528da8d8bd9cd8 \
            -- MEGANOTRPG-main \
            ':(exclude)MEGANOTRPG-main/src/data/classes/clericVossNarration.ts' \
            ':(exclude)MEGANOTRPG-main/src/data/classes/druidVossNarration.ts' \
            ':(exclude)MEGANOTRPG-main/src/data/classes/fighterVossNarration.ts' \
            | git -C target apply -p2

          git -C target config user.name "github-actions[bot]"
          git -C target config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C target add -A
          git -C target commit \
            -m "refactor: import Gemini validation and error handling" \
            -m "Imported from Gemini commit a75084b while preserving newer Voss translations on main."

      - name: Import Tailwind and styling update
        shell: bash
        run: |
          git -C source diff \
            a75084b424e2dcc76f339b517d528da8d8bd9cd8 \
            035fbbf9dbeeaa9a2a91d9a68757dd9fc789cadb \
            -- MEGANOTRPG-main \
            | git -C target apply -p2

          git -C target add -A
          git -C target commit \
            -m "feat: import Gemini Tailwind and styling update" \
            -m "Imported from Gemini commit 035fbbf."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Install dependencies
        working-directory: target
        run: npm ci

      - name: Lint
        working-directory: target
        run: npm run lint

      - name: Build production bundle
        working-directory: target
        run: npm run build

      - name: Run tests and record stale expectations
        working-directory: target
        continue-on-error: true
        run: npm test

      - name: Push imported commits to main
        working-directory: target
        run: git push origin HEAD:main
