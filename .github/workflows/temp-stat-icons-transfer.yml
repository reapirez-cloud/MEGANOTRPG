name: TEMP latest stat icon transfer

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/temp-stat-icons-transfer.yml"

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Download exact original PNGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/ui-icons/grimdark
          curl -fsSL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-5820-81f4-bdc7-7127902190eb/raw?se=2026-09-18T11%3A58%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=aab02b88-7638-5deb-b10d-a44a61056a95&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T09%3A30%3A54Z&ske=2026-09-19T09%3A30%3A54Z&sks=b&skv=2026-02-06&sig=zUvrbzYDuHORkTsC69O8VR8APNMwQXmyaywPdtPK4h8%3D' -o public/ui-icons/grimdark/strength.png
          curl -fsSL 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-5db4-8210-9f70-3733654690a6/raw?se=2026-09-18T11%3A58%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=7cc67d05-e923-5e5c-be68-1688c9b120c8&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T08%3A29%3A55Z&ske=2026-09-19T08%3A29%3A55Z&sks=b&skv=2026-02-06&sig=hkKfTmeVapcM96UaW5jEyTv%2Bd9L/qc5Gx6meoIpImtw%3D' -o public/ui-icons/grimdark/dexterity.png
          curl -fsSL 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-2ebc-8210-bbcd-89854f5ebdbc/raw?se=2026-09-18T11%3A58%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=c860c00a-b31a-579a-be0a-689866418863&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T09%3A30%3A54Z&ske=2026-09-19T09%3A30%3A54Z&sks=b&skv=2026-02-06&sig=XSA%2Bwl2pTxoyX5v7v6XOlid5naLv7VgZy3J1V1QsvKY%3D' -o public/ui-icons/grimdark/constitution.png
          curl -fsSL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-4c40-81f4-8c8c-67c86b517f0a/raw?se=2026-09-18T11%3A58%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=bfe7bf96-5404-5d12-bd60-b76f20996621&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T05%3A31%3A47Z&ske=2026-09-19T05%3A31%3A47Z&sks=b&skv=2026-02-06&sig=4DQLAS/RhB4fPyUfg2BU4xulEdvti8xEPnS6kpAb7XQ%3D' -o public/ui-icons/grimdark/intelligence.png
          curl -fsSL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-e918-81f5-8fa7-2fadd24efe95/raw?se=2026-09-18T11%3A58%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=4827a2a2-5185-525a-b7a2-a1a71f5c00a3&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T04%3A09%3A10Z&ske=2026-09-19T04%3A09%3A10Z&sks=b&skv=2026-02-06&sig=IGcNd1GOPG1YQIJux/9fuhde0Y4ON4MCQvDVssggeGM%3D' -o public/ui-icons/grimdark/wisdom.png
          curl -fsSL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-bd4c-81f4-95df-79730930f784/raw?se=2026-09-18T11%3A58%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=d310548a-2dff-5ff1-9e10-104d0720c8a6&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T07%3A52%3A05Z&ske=2026-09-19T07%3A52%3A05Z&sks=b&skv=2026-02-06&sig=373AJQvbMPVhvIdU5dW6coBaO4kSf2LhBwJrYp8qd28%3D' -o public/ui-icons/grimdark/charisma.png

          echo '7997b5910325a7e3638e3f65af4dbe864ca012de364e45e7e233568b2a7a1e12  public/ui-icons/grimdark/strength.png' | sha256sum -c -
          echo '30bf0bab69abccc0796d9864883c498356d0919e111195775fb4459c43f10f76  public/ui-icons/grimdark/dexterity.png' | sha256sum -c -
          echo 'ba844fb5ce53d3866841ce8a359e9ddbdcf7770bdbf81c1ff55ef93981c63080  public/ui-icons/grimdark/constitution.png' | sha256sum -c -
          echo '54d48f9eff062b16f9ae1b28dcedeeeb69c6760595f04d1ad4aa9616fbb67541  public/ui-icons/grimdark/intelligence.png' | sha256sum -c -
          echo 'cff08b1be5a5fb9073a7059b25aec603fcf6df3c58211552ea9094867094e479  public/ui-icons/grimdark/wisdom.png' | sha256sum -c -
          echo '2b336c121851d69760a5340b81d609de05ec497ab196038beb71fe03d4f1d780  public/ui-icons/grimdark/charisma.png' | sha256sum -c -
      - name: Commit assets and remove transfer workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-stat-icons-transfer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ui): apply latest stat icon pack"
          git push origin HEAD:dev
