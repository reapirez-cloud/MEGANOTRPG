name: Regenerate supplement materials

on:
  push:
    branches: [dev]
    paths:
      - scripts/generateOfficialSupplementSpellsJson.mjs
      - scripts/generateSupplementMaterialBackfill.mjs

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate supplement metadata
        run: |
          node scripts/generateOfficialSupplementSpellsJson.mjs
          node scripts/generateSupplementMaterialBackfill.mjs
      - name: Commit generated metadata
        run: |
          if git diff --quiet -- supabase/data/official_supplement_spells.json supabase/migrations/20260826124000_backfill_supplement_spell_materials.sql && [ -f supabase/migrations/20260826124000_backfill_supplement_spell_materials.sql ]; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/data/official_supplement_spells.json supabase/migrations/20260826124000_backfill_supplement_spell_materials.sql
          git commit -m "Regenerate supplement material metadata"
          git push origin HEAD:dev
