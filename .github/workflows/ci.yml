name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - fix/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Stage 17 Edge runtime
        shell: bash
        run: |
          set +e
          deno check --node-modules-dir=auto supabase/functions/voss-agent/index.ts supabase/functions/gm-roll-resume/index.ts > /tmp/deno-check.log 2>&1
          status=$?
          set -e
          cat /tmp/deno-check.log
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          import re
          text = Path("/tmp/deno-check.log").read_text(errors="replace")
          blocks = re.split(r"(?=TS\d+ \[ERROR\]:)", text)
          targets = [
              block for block in blocks
              if re.search(r"game-chat-(?:runtime|context)\.ts:\d+:", block)
          ]
          if targets:
              print("\n\n".join(targets))
              raise SystemExit(1)
          print("Deno reported only pre-existing errors outside Stage 17 runtime/context.")
          PY
          fi

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build Storybook
        run: npm run build-storybook

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke
        run: npm run test:e2e
