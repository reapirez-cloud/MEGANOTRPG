name: Generate official supplement spells

on:
  push:
    branches:
      - dev
    paths:
      - scripts/generateOfficialSupplementSpells.mjs
      - scripts/generateOfficialSupplementSpellsJson.mjs
      - .github/workflows/generate-official-spells.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate packages
        run: |
          node scripts/generateOfficialSupplementSpells.mjs
          node scripts/generateOfficialSupplementSpellsJson.mjs

      - name: Commit generated packages
        run: |
          if [ -z "$(git status --porcelain -- supabase/migrations/20260826095000_official_supplement_spell_catalog.sql supabase/data/official_supplement_spells.json)" ]; then
            echo "Generated spell data already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260826095000_official_supplement_spell_catalog.sql supabase/data/official_supplement_spells.json
          git commit -m "Generate official supplement spell data [generated-spells]"
          git push origin HEAD:dev
