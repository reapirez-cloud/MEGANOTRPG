name: Optimize UI icons

on:
  push:
    branches:
      - dev
    paths:
      - "public/ui-icons/grimdark/*.png"
      - ".github/workflows/optimize-ui-icons.yml"

permissions:
  contents: write

concurrency:
  group: optimize-ui-icons-dev
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Build lossless UI derivatives
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source_dir = Path("public/ui-icons/grimdark")
          output_dir = source_dir / "ui"
          output_dir.mkdir(parents=True, exist_ok=True)

          max_edge = 512
          sources = sorted(source_dir.glob("*.png"))
          if not sources:
              raise SystemExit("No source grimdark PNG icons found")

          for source in sources:
              with Image.open(source) as image:
                  image.load()
                  rendered = image.copy()

              if rendered.width > max_edge or rendered.height > max_edge:
                  rendered.thumbnail(
                      (max_edge, max_edge),
                      Image.Resampling.LANCZOS,
                      reducing_gap=3.0,
                  )

              target = output_dir / source.name
              rendered.save(
                  target,
                  format="PNG",
                  optimize=True,
                  compress_level=9,
              )
              print(
                  f"{source.name}: "
                  f"{image.width}x{image.height} -> "
                  f"{rendered.width}x{rendered.height}; "
                  f"{source.stat().st_size} -> {target.stat().st_size} bytes"
              )
          PY

      - name: Commit derived assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ui-icons/grimdark/ui
          if git diff --cached --quiet; then
            echo "UI icon derivatives are already current."
            exit 0
          fi
          git commit -m "perf(ui): optimize grimdark icon derivatives"
          git push origin HEAD:dev
